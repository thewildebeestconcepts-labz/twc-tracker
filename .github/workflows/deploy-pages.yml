# ===================================================================
# TWC Outreach Tracker — Deploy static frontend to GitHub Pages
# ===================================================================
# This workflow deploys the gas-source/github-pages/ static files
# (the Option B split-architecture frontend) to GitHub Pages.
#
# REQUIRED REPOSITORY SETTINGS (do this once):
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Actions → General → Workflow permissions:
#        "Read and write permissions" ✓
#
# The `permissions` block below is the fix for the error:
#   "Ensure GITHUB_TOKEN has permission 'id-token: write'"
# ===================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual run from the Actions tab

# CRITICAL — these permissions are required for actions/deploy-pages
# to fetch an OIDC ID token and publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the static frontend files
          path: ./gas-source/github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
